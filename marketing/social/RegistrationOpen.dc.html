<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .post {
      width: 1080px; height: 1080px;
      background: linear-gradient(160deg, #fff5f5 0%, #ffffff 55%, #fff0f1 100%);
      font-family: 'Alike', Georgia, serif;
      color: #241E1F;
      position: relative;
      overflow: hidden;
    }
  </style>

<div class="post">
  <div style="position:absolute; top:-180px; right:-180px; width:520px; height:520px; border-radius:9999px; background:#FCE2E5; opacity:0.6;"></div>

      <div style="font-size:18px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">Canadian Math League</div>
    </div>

    <div style="max-width:820px;">
      <div style="display:inline-block; border-radius:9999px; padding:10px 24px; background:#DC1F35; color:#fff; font-weight:700; font-size:20px; margin-bottom:32px;">
        Registration is open
      </div>
      <div style="font-size:104px; line-height:0.98; font-weight:700;">
        Register your<br>team. <span style="color:#DC1F35;">Free.</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:24px; color:#493D3F; max-width:520px; line-height:1.5;">
        Free for every Canadian high school. Group Stage starts December 17, 2025.
      </div>
      <div style="font-size:20px; font-weight:700; color:#DC1F35;">canadianmathleague.ca</div>
    </div>
  </div>
</div>
